<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>City Sunrises</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Georgia,serif;}
  canvas{display:block;}
  #hud{position:fixed;top:10px;left:0;right:0;text-align:center;color:#fff;
       text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;user-select:none;}
  #hud h1{font-size:22px;margin:0 0 4px;letter-spacing:2px;}
  #hud p{font-size:13px;margin:0;opacity:.9;padding:0 12px;}
  #tabs{position:fixed;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;z-index:5;max-height:90vh;overflow-y:auto;}
  #tabs button{font-family:Georgia,serif;font-size:12px;padding:4px 10px;border-radius:8px;
       border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#ddd;cursor:pointer;}
  #tabs button.on{background:rgba(255,210,120,.25);color:#ffe9b0;border-color:#ffd27a;}
  #tabsL{position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;z-index:5;max-height:90vh;overflow-y:auto;}
  #tabsL button{font-family:Georgia,serif;font-size:12px;padding:4px 10px;border-radius:8px;
       border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#ddd;cursor:pointer;}
  #tabsL button.on{background:rgba(255,210,120,.25);color:#ffe9b0;border-color:#ffd27a;}
  #win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       background:rgba(0,0,0,.25);z-index:9;}
  #win div{background:rgba(20,10,30,.85);color:#ffe9b0;padding:28px 40px;border-radius:14px;
       text-align:center;font-size:22px;box-shadow:0 0 40px rgba(255,180,80,.4);max-width:90vw;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>CITY SUNRISES</h1>
  <p>Hold SPACE (or click/tap) to drag the sun up before the timer runs out — 28 cities worldwide!</p>
</div>
<div id="tabsL"></div>
<div id="tabs"></div>
<div id="win"><div id="winmsg"></div></div>
<script>
const cv = document.getElementById('c'), x = cv.getContext('2d');
let W,H; function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;} fit(); onresize=fit;

/* ── cities ── */
const CITIES = [
  { name:'El Paso', flag:'🇺🇸', win:'🌅 ¡Ándale! The sun rises over the Franklins!',
    lose:'🌙 The sun slid back behind the mountains… El Paso sleeps on.' },
  { name:'New York', flag:'🗽', win:'🌅 The sun climbs over the Brooklyn Bridge — NYC wakes up!',
    lose:'🌙 The sun sank behind Jersey… the city that never sleeps sleeps in.' },
  { name:'Berlin', flag:'🇩🇪', win:'🌅 Sonnenaufgang! The sun rises over the Fernsehturm!',
    lose:'🌙 Die Sonne bleibt im Bett. Berlin stays gray a little longer.' },
  { name:'Paris', flag:'🇫🇷', win:'🌅 Le lever du soleil! Golden light on the Eiffel Tower!',
    lose:'🌙 Le soleil est retombé… Paris stays under its duvet.' },
  { name:'Tokyo', flag:'🇯🇵', win:'🌅 Asa no hikari! The sun rises beside Mt Fuji — ohayō, Tokyo!',
    lose:'🌙 The sun went back down. Tokyo hits snooze.' },
  { name:'London', flag:'🇬🇧', win:'🌅 Cheerio, night! The sun rises over Big Ben!',
    lose:'🌙 Back to bed — London stays foggy a while longer.' },
  { name:'Sydney', flag:'🇦🇺', win:'🌅 G’day sunshine! Dawn breaks over the Opera House!',
    lose:'🌙 The sun dove back into the harbour. Keep trying, mate!' },
  { name:'Dubai', flag:'🇦🇪', win:'🌅 The sun tops the Burj Khalifa — Dubai blazes gold!',
    lose:'🌙 The sun sank below the dunes. Dubai sleeps in the shade.' },
  { name:'Cairo', flag:'🇪🇬', win:'🌅 The sun crowns the pyramids — just like 4,500 years ago!',
    lose:'🌙 Ra goes back to the underworld. Cairo waits.' },
  { name:'Rio', flag:'🇧🇷', win:'🌅 Bom dia! Christ the Redeemer glows in the first light!',
    lose:'🌙 The sun rolled back behind Sugarloaf. Samba at dawn, anyone?' },
  { name:'Singapore', flag:'🇸🇬', win:'🌅 The sun rises over Marina Bay — Singapore shines!',
    lose:'🌙 The Lion City naps a little longer.' },
  { name:'Moscow', flag:'🇷🇺', win:'🌅 The sun rises over St Basil’s domes — Dobroye utro!',
    lose:'🌙 The sun retreated behind the Kremlin. Moscow stays cold and dark.' },
  { name:'Istanbul', flag:'🇹🇷', win:'🌅 Günaydın! Dawn breaks over the Bosphorus domes!',
    lose:'🌙 The sun slipped back across two continents. Güle güle, morning.' },
  { name:'Toronto', flag:'🇨🇦', win:'🌅 The sun crests the CN Tower — the 6ix is up!',
    lose:'🌙 Sorry, the sun went back down, eh. Toronto sleeps in.' },
  { name:'Los Angeles', flag:'🌴', win:'🌅 Another day in LA! The sun climbs over the palm hills!',
    lose:'🌙 The sun rolled back behind the 405. Traffic waits for no one.' },
  { name:'Chicago', flag:'🥶', win:'🌅 The sun tops the Willis Tower — Chicago shines on the lake!',
    lose:'🌙 The sun dove into Lake Michigan. The wind city stays windswept and dark.' },
  { name:'Mexico City', flag:'🇲🇽', win:'🌅 ¡Buenos días! Popocatépetl glows over the Zócalo!',
    lose:'🌙 The sun went back behind Popocatépetl. CDMX descansa.' },
  { name:'Buenos Aires', flag:'🇦🇷', win:'🌅 ¡Buen día! The Obelisco catches the first light!',
    lose:'🌙 The sun folded like a tango finale. Buenos Aires sleeps.' },
  { name:'Seoul', flag:'🇰🇷', win:'🌅 좋은 아침! N Seoul Tower glows above the Han River!',
    lose:'🌙 The sun set back over Namsan. Seoul hits snooze.' },
  { name:'Shanghai', flag:'🇨🇳', win:'🌅 The Oriental Pearl lights up — Shanghai greets the day!',
    lose:'🌙 The sun sank into the Huangpu. Shanghai stays on Do Not Disturb.' },
  { name:'Hong Kong', flag:'🐉', win:'🌅 The sun rises over Victoria Peak — Hong Kong dazzles!',
    lose:'🌙 The sun ducked behind the Peak. Hong Kong pours another milk tea.' },
  { name:'Bangkok', flag:'🛕', win:'🌅 Sawasdee! Dawn gilds Wat Arun by the Chao Phraya!',
    lose:'🌙 The sun slid back behind the temple. Bangkok dreams on.' },
  { name:'Mumbai', flag:'🇮🇳', win:'🌅 The sun rises through the Gateway of India — Shubh prabhat!',
    lose:'🌙 The sun retreated into the Arabian Sea. Mumbai mono daus.' },
  { name:'Athens', flag:'🏛️', win:'🌅 Kalimera! The sun crowns the Acropolis!',
    lose:'🌙 Zeus pulled the sun back. Athens waits for the gods.' },
  { name:'Rome', flag:'🏛️', win:'🌅 Buongiorno! The sun rises over St Peter\u2019s dome!',
    lose:'🌙 Roma dolce far niente — the sun stays abed.' },
  { name:'Cape Town', flag:'🐧', win:'🌅 Lekker! The sun clears Table Mountain\u2019s tablecloth!',
    lose:'🌙 The sun slid back behind Table Mountain. Lekker slapt, Cape Town.' },
  { name:'Amsterdam', flag:'🚲', win:'🌅 Goedemorgen! Sunlight sparkles on the canal houses!',
    lose:'🌙 The sun sank below the canals. Amsterdam winds down.' },
  { name:'Auckland', flag:'🥝', win:'🌅 Kia ora! The Sky Tower catches the first light of the day!',
    lose:'🌙 The sun rolled back into the Hauraki Gulf. Auckland, later mate.' },
];

const startTime = 30;
let sunY = 0.95, t = startTime, playing = true, charging = false, cityIdx = 0;
let stars = Array.from({length:120},()=>({x:Math.random(),y:Math.random()*0.5,s:Math.random()*1.5+.3}));
let birds = [];
for(let i=0;i<5;i++) birds.push({x:Math.random(),y:.15+Math.random()*.2,v:.0006+Math.random()*.0009,f:Math.random()*10});

/* tabs — 0-13 on the right, 14-27 on the left */
const tabsEl = document.getElementById('tabs'), tabsLEl = document.getElementById('tabsL');
const tabsList = [...tabsEl.children, ...tabsLEl.children];
CITIES.forEach((c,i)=>{
  const b=document.createElement('button'); b.textContent=c.flag+' '+c.name;
  (i<14?tabsEl:tabsLEl).appendChild(b);
  b.onclick=()=>setCity(i);
});
const allTabs = ()=>[...tabsEl.children, ...tabsLEl.children];
function setCity(i){ cityIdx=i;
  allTabs().forEach((b,j)=>b.classList.toggle('on',j===i));
}
setCity(0);

/* input */
const press = () => { if(playing) charging=true; };
const release = () => charging=false;
addEventListener('keydown',e=>{if(e.code==='Space')press();});
addEventListener('keyup',release);
addEventListener('mousedown',press); addEventListener('mouseup',release);
addEventListener('touchstart',e=>{if(e.target.tagName!=='BUTTON'){e.preventDefault();press();}},{passive:false});
addEventListener('touchend',release);

const lerp=(a,b,k)=>a+(b-a)*k;
const mix=(c1,c2,k)=>`rgb(${lerp(c1[0],c2[0],k)|0},${lerp(c1[1],c2[1],k)|0},${lerp(c1[2],c2[2],k)|0})`;
function skyCol(k){ return k<0.5 ? mix([8,10,30],[120,40,70],k*2) : mix([120,40,70],[110,180,235],(k-0.5)*2); }
function glowCol(k){ return k<0.5 ? mix([60,20,50],[255,110,50],k*2) : mix([255,110,50],[255,220,140],(k-0.5)*2); }

const horizon = () => H*0.72;
function buildings(yBase, seed, col, lit, minH, maxH){
  x.fillStyle = col;
  let bx = -((seed*97)%40);
  let i = seed;
  while(bx < W+40){
    i++;
    const bw = 22+((i*37+seed*13)%36);
    const bh = minH + ((i*53+seed*29)%100)/100*(maxH-minH);
    x.fillRect(bx, yBase-bh, bw, bh);
    if(lit){
      for(let wy=yBase-bh+8; wy<yBase-8; wy+=11){
        for(let wx=bx+4; wx<bx+bw-6; wx+=9){
          const on = ((wx*7+wy*13+i)|0)%4===0;
          x.fillStyle = on ? '#ffd27a' : 'rgba(0,0,0,0)';
          if(on) x.fillRect(wx,wy,3,5);
        }
      }
      x.fillStyle = col;
    }
    bx += bw + 4+((i*17)%10);
  }
}

/* domes helper — onion (Moscow/Hagia style) */
function dome(cx, cy, r, col){
  x.fillStyle=col;
  x.beginPath();
  x.moveTo(cx-r, cy);
  x.quadraticCurveTo(cx-r, cy-r*1.1, cx, cy-r*1.45);
  x.quadraticCurveTo(cx+r, cy-r*1.1, cx+r, cy);
  x.closePath(); x.fill();
}

/* ── per-city skylines ── */
function drawSkyline(idx, k){
  const y = horizon(), lit = k>0.25;
  const g1 = mix([10,8,18],[40,35,60],k), g2 = mix([18,14,28],[60,50,80],k);
  const g3 = mix([30,24,50],[95,85,120],k);

  if(idx===0){ // El Paso — mountains
    x.fillStyle=mix([25,20,45],[70,55,95],k);
    x.beginPath(); x.moveTo(0,y-H*0.02); x.lineTo(W*0.10,y-H*0.08); x.lineTo(W*0.30,y-H*0.20);
    x.lineTo(W*0.42,y-H*0.02); x.lineTo(W*0.58,y-H*0.10); x.lineTo(W*0.85,y-H*0.04); x.lineTo(W,y-H*0.02);
    x.lineTo(W,y); x.lineTo(0,y); x.fill();
    buildings(y, 7, g1, lit, H*0.04, H*0.10);

  } else if(idx===1){ // New York
    buildings(y, 3, g1, lit, H*0.10, H*0.24);
    const ex=W*0.30, ew=W*0.05, eh=H*0.30;
    x.fillStyle=g2; x.fillRect(ex,y-eh,ew,eh); x.fillRect(ex+ew*0.3,y-eh-H*0.06,ew*0.4,H*0.06);
    x.fillRect(ex+ew*0.42,y-eh-H*0.10,ew*0.16,H*0.05);
    x.strokeStyle=mix([30,25,50],[80,70,105],k); x.lineWidth=3;
    x.beginPath(); x.moveTo(0,y-H*0.06);
    x.quadraticCurveTo(W*0.5,y+H*0.02,W,y-H*0.06); x.stroke();
    [0.3,0.5,0.7].forEach(f=>{
      x.fillStyle=mix([30,25,50],[80,70,105],k);
      x.fillRect(W*f-4, y-H*0.06-((f===0.5)?H*0.10:H*0.05), 8, ((f===0.5)?H*0.10:H*0.05)+H*0.03);
      x.beginPath(); x.moveTo(W*f, y-H*0.15);
      x.quadraticCurveTo(W*f+0.1*W, y-H*0.02, W*f+0.16*W, y-H*0.045);
      x.moveTo(W*f, y-H*0.15);
      x.quadraticCurveTo(W*f-0.1*W, y-H*0.02, W*f-0.16*W, y-H*0.045);
      x.lineWidth=1.5; x.stroke(); x.lineWidth=3;
    });
    buildings(y, 11, g2, lit, H*0.05, H*0.13);

  } else if(idx===2){ // Berlin
    buildings(y, 5, g1, lit, H*0.05, H*0.12);
    const fx=W*0.5;
    x.strokeStyle=g3; x.lineWidth=5;
    x.beginPath(); x.moveTo(fx,y); x.lineTo(fx,y-H*0.26); x.stroke();
    x.fillStyle=g3;
    x.beginPath(); x.arc(fx,y-H*0.26,10,0,7); x.fill();
    x.fillRect(fx-2,y-H*0.26-26,4,22); x.fillRect(fx-6,y-H*0.26-32,12,4);
    x.beginPath(); x.arc(W*0.18, y, H*0.07, Math.PI, 0); x.fill();
    buildings(y, 13, g2, lit, H*0.03, H*0.08);

  } else if(idx===3){ // Paris
    buildings(y, 9, g1, lit, H*0.04, H*0.10);
    const ex=W*0.5, th=H*0.34;
    x.fillStyle=g3;
    x.beginPath();
    x.moveTo(ex-14,y); x.lineTo(ex-34,y-th*0.36); x.lineTo(ex-10,y-th*0.36);
    x.lineTo(ex-4,y-th*0.62); x.lineTo(ex-2,y-th); x.lineTo(ex+2,y-th);
    x.lineTo(ex+4,y-th*0.62); x.lineTo(ex+10,y-th*0.36); x.lineTo(ex+34,y-th*0.36);
    x.lineTo(ex+14,y); x.closePath(); x.fill();
    x.fillRect(ex-40,y-th*0.36-6,80,6);
    x.fillRect(ex-14,y-th*0.62-5,28,5);
    x.strokeStyle=g3; x.lineWidth=2;
    x.beginPath(); x.moveTo(ex-34,y-th*0.36); x.lineTo(ex+14,y); x.stroke();
    x.beginPath(); x.moveTo(ex+34,y-th*0.36); x.lineTo(ex-14,y); x.stroke();
    x.beginPath(); x.moveTo(ex-10,y-th*0.36); x.lineTo(ex+4,y-th*0.62); x.stroke();
    x.beginPath(); x.moveTo(ex+10,y-th*0.36); x.lineTo(ex-4,y-th*0.62); x.stroke();
    x.beginPath(); x.arc(W*0.16, y, H*0.045, Math.PI, 0); x.fill();
    x.beginPath(); x.arc(W*0.16, y-H*0.045, H*0.02, 0, 7); x.fill();
    buildings(y, 15, g2, lit, H*0.03, H*0.07);

  } else if(idx===4){ // Tokyo — Tokyo Tower + Mt Fuji
    // Fuji in background
    x.fillStyle=mix([40,35,65],[130,120,160],k);
    x.beginPath(); x.moveTo(W*0.05,y); x.lineTo(W*0.20,y-H*0.22); x.lineTo(W*0.24,y-H*0.19);
    x.lineTo(W*0.28,y-H*0.22); x.lineTo(W*0.43,y); x.fill();
    x.fillStyle=`rgba(255,255,255,${0.25+k*0.3})`;
    x.beginPath(); x.moveTo(W*0.20-H*0.03,y-H*0.19); x.lineTo(W*0.20,y-H*0.22);
    x.lineTo(W*0.24,y-H*0.19); x.lineTo(W*0.22,y-H*0.17);
    x.lineTo(W*0.215,y-H*0.185); x.lineTo(W*0.205,y-H*0.17); x.closePath(); x.fill();
    buildings(y, 4, g1, lit, H*0.08, H*0.18);
    // Tokyo Tower (red lattice)
    const tx=W*0.62, th=H*0.30;
    x.fillStyle=mix([120,40,35],[200,70,55],k);
    x.beginPath();
    x.moveTo(tx-16,y); x.lineTo(tx-4,y-th); x.lineTo(tx+4,y-th); x.lineTo(tx+16,y); x.closePath(); x.fill();
    x.fillRect(tx-22,y-th*0.60-5,44,5);
    x.fillRect(tx-30,y-th*0.30-6,60,6);
    x.fillRect(tx-3,y-th-H*0.02,6,H*0.02);
    x.strokeStyle=mix([120,40,35],[200,70,55],k); x.lineWidth=1.5;
    x.beginPath(); x.moveTo(tx-16,y); x.lineTo(tx+4,y-th*0.55); x.stroke();
    x.beginPath(); x.moveTo(tx+16,y); x.lineTo(tx-4,y-th*0.55); x.stroke();
    buildings(y, 8, g2, lit, H*0.04, H*0.11);

  } else if(idx===5){ // London — Big Ben + London Eye
    buildings(y, 6, g1, lit, H*0.04, H*0.11);
    // Big Ben
    const bx=W*0.30, bw=W*0.035, bh=H*0.30;
    x.fillStyle=g3; x.fillRect(bx,y-bh,bw,bh);
    x.fillStyle=mix([60,50,80],[130,120,150],k);
    x.fillRect(bx-2,y-bh-H*0.05,bw+4,H*0.05);
    x.beginPath(); x.moveTo(bx-2,y-bh-H*0.05); x.lineTo(bx+bw/2,y-bh-H*0.10); x.lineTo(bx+bw+2,y-bh-H*0.05); x.fill();
    // clock face
    x.fillStyle=`rgba(255,235,170,${0.5+k*0.5})`;
    x.beginPath(); x.arc(bx+bw/2,y-bh+H*0.035,H*0.018,0,7); x.fill();
    // London Eye
    const ex=W*0.66, er=H*0.13;
    x.strokeStyle=g3; x.lineWidth=4;
    x.beginPath(); x.arc(ex,y-er,er,0,7); x.stroke();
    x.lineWidth=1;
    for(let a=0;a<12;a++){
      const ang=a*Math.PI/6;
      x.beginPath(); x.moveTo(ex,y-er);
      x.lineTo(ex+Math.cos(ang)*er, y-er+Math.sin(ang)*er); x.stroke();
    }
    x.lineWidth=4;
    x.beginPath(); x.moveTo(ex-er*0.5,y); x.lineTo(ex,y-er);
    x.lineTo(ex+er*0.5,y); x.stroke();
    buildings(y, 14, g2, lit, H*0.03, H*0.08);

  } else if(idx===6){ // Sydney — Opera House + Harbour Bridge
    buildings(y, 12, g1, lit, H*0.03, H*0.08);
    // Opera House sails
    x.fillStyle=g3;
    [[0.30,1.0],[0.38,1.3],[0.47,0.8]].forEach(([f,s])=>{
      const cx=W*f, sh=H*0.10*s;
      x.beginPath();
      x.moveTo(cx-sh*0.5, y);
      x.quadraticCurveTo(cx-sh*0.45, y-sh, cx+sh*0.15, y-sh*1.05);
      x.lineTo(cx+sh*0.3, y);
      x.closePath(); x.fill();
    });
    // Harbour Bridge
    x.strokeStyle=g2; x.lineWidth=5;
    x.beginPath(); x.moveTo(W*0.62,y); x.lineTo(W*0.68,y-H*0.16);
    x.quadraticCurveTo(W*0.78,y-H*0.24,W*0.88,y-H*0.16); x.lineTo(W*0.94,y); x.stroke();
    x.lineWidth=2;
    x.beginPath(); x.moveTo(W*0.66,y-H*0.04);
    x.quadraticCurveTo(W*0.78,y-H*0.13,W*0.90,y-H*0.04); x.stroke();
    buildings(y, 18, g2, lit, H*0.04, H*0.09);

  } else if(idx===7){ // Dubai — Burj Khalifa
    buildings(y, 10, g1, lit, H*0.08, H*0.20);
    const dx=W*0.55;
    x.fillStyle=g3;
    x.fillRect(dx-10,y-H*0.36,20,H*0.36);
    x.fillRect(dx-16,y-H*0.24,32,H*0.24);
    x.fillRect(dx-22,y-H*0.14,44,H*0.14);
    x.fillRect(dx-2,y-H*0.42,4,H*0.06);
    // Burj Al Arab sail
    x.fillStyle=g2;
    x.beginPath(); x.moveTo(W*0.80,y);
    x.quadraticCurveTo(W*0.80,y-H*0.20,W*0.88,y-H*0.20);
    x.lineTo(W*0.88,y); x.closePath(); x.fill();
    buildings(y, 20, g2, lit, H*0.04, H*0.10);

  } else if(idx===8){ // Cairo — pyramids + sphinx hint
    x.fillStyle=mix([70,50,40],[190,140,100],k);
    x.beginPath(); x.moveTo(W*0.10,y); x.lineTo(W*0.30,y-H*0.20); x.lineTo(W*0.50,y); x.fill();
    x.fillStyle=mix([55,40,32],[160,115,80],k);
    x.beginPath(); x.moveTo(W*0.38,y); x.lineTo(W*0.54,y-H*0.13); x.lineTo(W*0.70,y); x.fill();
    x.fillStyle=`rgba(255,230,180,${0.2+k*0.3})`;
    x.beginPath(); x.moveTo(W*0.30,y-H*0.20); x.lineTo(W*0.36,y-H*0.085); x.lineTo(W*0.24,y-H*0.085); x.closePath(); x.fill();
    buildings(y, 22, g1, lit, H*0.03, H*0.07);

  } else if(idx===9){ // Rio — Sugarloaf + Christ the Redeemer
    x.fillStyle=mix([35,30,45],[80,95,80],k);
    x.beginPath(); x.moveTo(W*0.70,y); x.quadraticCurveTo(W*0.74,y-H*0.18,W*0.80,y-H*0.20);
    x.quadraticCurveTo(W*0.86,y-H*0.16,W*0.90,y); x.fill();
    // Christ statue on Corcovado
    const cx=W*0.40, cy=y-H*0.24;
    x.strokeStyle=mix([200,190,180],[245,240,230],k); x.lineWidth=3;

function draw(now){
  const k = 1-sunY;
  const g = x.createLinearGradient(0,0,0,horizon());
  g.addColorStop(0, mix([5,5,20],[80,150,220],k));
  g.addColorStop(1, skyCol(k));
  x.fillStyle=g; x.fillRect(0,0,W,horizon());
  const sunX = W*0.62, sy = lerp(H*0.9, H*0.12, k);
  const glow = x.createRadialGradient(sunX,sy,10,sunX,sy,H*0.7);
  const gc = glowCol(k);
  glow.addColorStop(0, gc.replace('rgb','rgba').replace(')',',0.9)'));
  glow.addColorStop(1, gc.replace('rgb','rgba').replace(')',',0)'));
  x.fillStyle=glow; x.fillRect(0,0,W,horizon());
  const sa = Math.max(0,1-k*1.8);
  if(sa>0){ x.fillStyle=`rgba(255,255,255,${sa})`;
    stars.forEach(s=>x.fillRect(s.x*W, s.y*H, s.s, s.s)); }
  if(sy < horizon()+40){
    x.fillStyle = k<0.5 ? '#ffcf6e' : '#fff3c0';
    x.beginPath(); x.arc(sunX, sy, 34, 0, 7); x.fill();
  }
  drawSkyline(cityIdx, k);
  x.fillStyle=mix([6,5,12],[25,22,40],k); x.fillRect(0,horizon(),W,H);
  if(k>0.4){ x.strokeStyle='rgba(20,15,30,.8)'; x.lineWidth=2;
    birds.forEach(b=>{
      b.x+=b.v; if(b.x>1.05)b.x=-0.05;
      const fy = Math.sin(now/300+b.f)*6, bx=b.x*W, by=b.y*H+fy;
      x.beginPath(); x.moveTo(bx-8,by); x.quadraticCurveTo(bx-3,by-5,bx,by);
      x.quadraticCurveTo(bx+3,by-5,bx+8,by); x.stroke();
    });
  }
  x.fillStyle='rgba(0,0,0,.4)'; x.fillRect(W/2-160,H-46,320,14);
  x.fillStyle = t<8 ? '#ff5555' : '#ffd27a';
  x.fillRect(W/2-158,H-44,316*Math.max(0,t/startTime),10);
  x.fillStyle='#fff'; x.font='16px Georgia'; x.textAlign='center';
  x.fillText(CITIES[cityIdx].flag+' '+CITIES[cityIdx].name+' — '+Math.max(0,t).toFixed(1)+'s', W/2, H-56);
}

let last = performance.now();
function loop(now){
  const dt = (now-last)/1000; last=now;
  if(playing){
    if(charging) sunY = Math.max(0, sunY - dt*0.10);
    else         sunY = Math.min(1, sunY + dt*0.035);
    t -= dt;
    if(sunY <= 0.02){ playing=false; showWin(true); }
    if(t<=0){ playing=false; showWin(false); }
  }
  draw(now);
  requestAnimationFrame(loop);
}
function showWin(w){
  const c=CITIES[cityIdx];
  const el=document.getElementById('win'), msg=document.getElementById('winmsg');
  msg.innerHTML = (w?c.win:c.lose)+'<br><br><span style="font-size:16px">Click to retry — or switch cities</span>';
  el.style.display='flex';
  const onTab = e => e.target.tagName==='BUTTON';
  el.onclick = e => { if(onTab(e))return;
    sunY=0.95; t=startTime; playing=true; el.style.display='none'; };
  [tabsEl,tabsLEl].forEach(te => te.onclick = e => { if(onTab(e) && !playing){
    el.style.display='none'; sunY=0.95; t=startTime; playing=true; } });
}
requestAnimationFrame(loop);
</script>
