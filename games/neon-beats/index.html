<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neon Beats — Snail Arcade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0a0a0a;color:#fff;font-family:'Courier New',monospace;touch-action:none;-webkit-tap-highlight-color:transparent}body{display:grid;place-items:center}#wrap{position:relative;width:100%;height:100%;display:grid;place-items:center}canvas{display:block;background:#090912;box-shadow:0 0 40px rgba(0,0,0,.65),0 0 32px rgba(0,255,136,.12);touch-action:none}#start,#gameover,#pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,10,.88);z-index:5;padding:20px}#start.active,#gameover.active,#pause.active{display:flex}.panel{width:min(390px,92vw);padding:28px 22px;border:2px solid #00ff88;border-radius:16px;background:rgba(10,10,15,.96);box-shadow:0 0 35px rgba(0,255,136,.25);text-align:center}.panel h1{font-size:clamp(30px,9vw,48px);color:#00ff88;text-shadow:0 0 20px #00ff8877;letter-spacing:2px}.panel h2{color:#ff5577;font-size:34px}.panel p{color:#aaa;margin:10px 0;line-height:1.45}.panel .best{color:#00ff88;font-size:18px}.panel .hint{font-size:13px;color:#777}.panel button{margin-top:14px;padding:14px 28px;border:0;border-radius:8px;background:#00ff88;color:#061009;font:700 18px 'Courier New';cursor:pointer}.keys{display:flex;justify-content:center;gap:7px;margin:14px 0}.keys b{min-width:38px;padding:8px;border:1px solid #555;border-bottom-width:4px;border-radius:6px;color:#fff}.new{color:#ffd84a;font-weight:bold}
</style>
</head>
<body><div id="wrap"><canvas id="game" width="480" height="720"></canvas>
<div id="start"><div class="panel"><h1>NEON BEATS</h1><p>Hit the pulse as notes cross the green line.<br>Build a combo. Survive the whole set.</p><div class="keys"><b>D</b><b>F</b><b>J</b><b>K</b></div><p>Keyboard, click, or tap any lane</p><p class="best">BEST <span id="startBest">0</span></p><button id="startBtn">PLAY SET</button><p class="hint">Audio starts after your first input</p></div></div>
<div id="gameover"><div class="panel"><h2>SET COMPLETE</h2><p id="result">Score 0</p><p class="best">BEST <span id="overBest">0</span></p><p id="record" class="new"></p><button id="retryBtn">ENCORE</button><p class="hint">SPACE / ENTER also retries</p></div></div>
</div><script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const start=document.getElementById('start'),over=document.getElementById('gameover');
const pauseEl=document.createElement('div');pauseEl.id='pause';pauseEl.innerHTML='<div class="panel"><h1>⏸ PAUSED</h1><p>The beat is holding its breath.</p><button id="resumeBtn">RESUME</button><p class="hint">P to resume · Q to quit set</p></div>';document.getElementById('wrap').appendChild(pauseEl);
const startBest=document.getElementById('startBest'),overBest=document.getElementById('overBest'),result=document.getElementById('result'),record=document.getElementById('record');
const GW=480,GH=720,LANES=4,hitY=590,colors=['#ff3e73','#ffe14d','#35a7ff','#9a5cff'],keys=['D','F','J','K'];
let state='ready',notes=[],particles=[],judgments=[],laneFlash=[0,0,0,0],score=0,combo=0,maxCombo=0,health=100,elapsed=0,duration=62,spawnBeat=0,beat=0,last=0,shake=0,frameCount=0,gameOverTimer=null,paused=false,acc={perfect:0,great:0,good:0,miss:0};
let best=parseInt(localStorage.getItem('neon-beats-best')||'0',10);startBest.textContent=best;
let audio=null;
function resize(){const s=Math.min(innerWidth/GW,innerHeight/GH);canvas.style.width=Math.floor(GW*s)+'px';canvas.style.height=Math.floor(GH*s)+'px'}addEventListener('resize',resize);resize();
function setOverlay(name){start.classList.toggle('active',name==='start');over.classList.toggle('active',name==='gameover');pauseEl.classList.toggle('active',name==='pause')}
function sound(freq,dur=.05,type='sine',vol=.035){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function reset(){clearTimeout(gameOverTimer);notes=[];particles=[];judgments=[];laneFlash=[0,0,0,0];score=combo=maxCombo=elapsed=beat=spawnBeat=0;health=100;shake=0;paused=false;acc={perfect:0,great:0,good:0,miss:0};state='playing';setOverlay(null);last=performance.now();sound(220,.08,'square')}
function togglePause(){if(state!=='playing')return;paused=!paused;if(paused){setOverlay('pause')}else{last=performance.now();setOverlay(null)}}
function spawnPattern(){const difficulty=Math.min(1,elapsed/50),speed=270+difficulty*105;let pattern=Math.random();const lanes=[];if(pattern<.16+difficulty*.13){const a=Math.floor(Math.random()*4);lanes.push(a,(a+1+Math.floor(Math.random()*2))%4)}else lanes.push(Math.floor(Math.random()*4));for(const lane of [...new Set(lanes)])notes.push({lane,y:-22,speed,hit:false,glow:1})}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*150;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color})}}
function judge(lane){if(state!=='playing'||paused)return;laneFlash[lane]=1;let idx=-1,dist=999;for(let i=0;i<notes.length;i++){const d=Math.abs(notes[i].y-hitY);if(notes[i].lane===lane&&d<dist){idx=i;dist=d}}if(idx<0||dist>82){combo=0;health=Math.max(0,health-3);acc.miss++;judgments.push({text:'MISS',x:lane*120+60,y:hitY-50,life:1,color:'#ff3e73'});sound(90,.05,'sawtooth',.02);return}notes.splice(idx,1);let text,pts;if(dist<18){text='PERFECT';pts=100;acc.perfect++;health=Math.min(100,health+2);sound([392,440,523,587][lane],.07,'square')}else if(dist<42){text='GREAT';pts=70;acc.great++;health=Math.min(100,health+1);sound([330,370,440,494][lane],.06,'triangle')}else{text='GOOD';pts=40;acc.good++;sound(260+lane*45,.04)}combo++;maxCombo=Math.max(maxCombo,combo);score+=Math.round(pts*(1+Math.min(combo,50)*.025));judgments.push({text,x:lane*120+60,y:hitY-46,life:1,color:colors[lane]});burst(lane*120+60,hitY,colors[lane],8+Math.min(14,combo/3));shake=dist<18?3:1}
function finish(){if(state!=='playing')return;state='dead';paused=false;setOverlay(null);const isNew=score>best;if(isNew){best=score;localStorage.setItem('neon-beats-best',best)}startBest.textContent=overBest.textContent=best;const tot=acc.perfect+acc.great+acc.good+acc.miss,accPct=tot?Math.round((acc.perfect+acc.great+acc.good)/tot*100):0;result.innerHTML=`SCORE <b>${score}</b><br>MAX COMBO ${maxCombo}x<br>ACCURACY ${accPct}% · P${acc.perfect} G${acc.great} O${acc.good} M${acc.miss}<br>${health>0?'TRACK CLEARED':'SIGNAL LOST'}`;record.textContent=isNew?'★ NEW HIGH SCORE ★':'';gameOverTimer=setTimeout(()=>{if(state==='dead')setOverlay('gameover')},550)}
function update(dt){if(state!=='playing'||paused)return;elapsed+=dt;beat+=dt;const interval=Math.max(.34,.68-elapsed*.0045);while(beat>=interval){beat-=interval;spawnBeat++;spawnPattern();if(spawnBeat%4===0)sound(110,.025,'sine',.012)}for(let i=notes.length-1;i>=0;i--){const n=notes[i];n.y+=n.speed*dt;if(n.y>hitY+95){notes.splice(i,1);combo=0;health-=10;acc.miss++;judgments.push({text:'MISS',x:n.lane*120+60,y:hitY-45,life:1,color:'#ff3e73'});shake=5}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt*2.3;if(p.life<=0)particles.splice(i,1)}for(let i=judgments.length-1;i>=0;i--){judgments[i].y-=35*dt;judgments[i].life-=dt*1.7;if(judgments[i].life<=0)judgments.splice(i,1)}for(let i=0;i<4;i++)laneFlash[i]=Math.max(0,laneFlash[i]-dt*5);shake*=.82;if(health<=0||elapsed>=duration)finish()}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);const bg=ctx.createLinearGradient(0,0,0,GH);bg.addColorStop(0,'#070712');bg.addColorStop(1,'#11071c');ctx.fillStyle=bg;ctx.fillRect(-10,-10,GW+20,GH+20);for(let i=0;i<40;i++){const y=(i*97+frameCount*.18)%GH;ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect((i*137)%GW,y,1,1)}for(let l=0;l<4;l++){const x=l*120;ctx.fillStyle=laneFlash[l]?colors[l]+'33':(l%2?'#ffffff05':'#00000018');ctx.fillRect(x,0,120,GH);ctx.strokeStyle=colors[l]+'28';ctx.strokeRect(x+.5,0,119,GH)}ctx.fillStyle='#05080a';ctx.fillRect(0,hitY-8,GW,16);ctx.shadowColor='#00ff88';ctx.shadowBlur=18;ctx.strokeStyle='#00ff88';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,hitY);ctx.lineTo(GW,hitY);ctx.stroke();ctx.shadowBlur=0;for(const n of notes){const x=n.lane*120+60,near=Math.max(0,1-Math.abs(n.y-hitY)/130),r=17+near*5;ctx.shadowColor=colors[n.lane];ctx.shadowBlur=12+near*18;ctx.fillStyle=colors[n.lane];ctx.beginPath();ctx.roundRect(x-35,n.y-r/2,70,r,6);ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=.45;ctx.fillRect(x-24,n.y-r/2+4,48,3);ctx.globalAlpha=1}ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;for(const j of judgments){ctx.globalAlpha=j.life;ctx.fillStyle=j.color;ctx.font='bold 15px Courier New';ctx.textAlign='center';ctx.fillText(j.text,j.x,j.y)}ctx.globalAlpha=1;for(let l=0;l<4;l++){ctx.fillStyle=colors[l]+'55';ctx.fillRect(l*120+8,630,104,62);ctx.fillStyle='#fff';ctx.font='bold 24px Courier New';ctx.textAlign='center';ctx.fillText(keys[l],l*120+60,669)}ctx.fillStyle='#ddd';ctx.font='bold 18px Courier New';ctx.textAlign='left';ctx.fillText(String(score).padStart(7,'0'),16,31);ctx.textAlign='right';ctx.fillStyle=combo>9?'#ffe14d':'#aaa';ctx.fillText(combo+'x COMBO',464,31);ctx.fillStyle='#24242c';ctx.fillRect(16,48,448,10);ctx.fillStyle=health>35?'#00ff88':'#ff3e73';ctx.fillRect(16,48,448*Math.max(0,health)/100,10);ctx.fillStyle='#777';ctx.font='12px Courier New';ctx.textAlign='center';ctx.fillText(state==='playing'?Math.max(0,Math.ceil(duration-elapsed))+'s':'NEON BEATS',240,79);ctx.restore()}
function loop(t){frameCount++;const dt=Math.min(.034,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function pointer(e){e.preventDefault();if(state!=='playing')return;const r=canvas.getBoundingClientRect(),x=((e.clientX??e.touches?.[0]?.clientX)-r.left)*GW/r.width;judge(Math.max(0,Math.min(3,Math.floor(x/120))))}
canvas.addEventListener('pointerdown',pointer);addEventListener('keydown',e=>{const map={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3};if(map[e.code]!==undefined){e.preventDefault();judge(map[e.code])}else if(e.code==='KeyP'&&state==='playing'){e.preventDefault();togglePause()}else if(e.code==='KeyQ'&&paused){e.preventDefault();state='ready';paused=false;setOverlay('start')}else if((e.code==='Space'||e.code==='Enter')&&state!=='playing'){e.preventDefault();reset()}});document.getElementById('startBtn').onclick=reset;document.getElementById('retryBtn').onclick=reset;pauseEl.querySelector('#resumeBtn').onclick=()=>togglePause();addEventListener('blur',()=>{if(state==='playing'&&!paused)togglePause()});setOverlay('start');requestAnimationFrame(loop);
})();
</script></body></html>
