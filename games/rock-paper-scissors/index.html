<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rock Paper Scissors 3D — Arena Battle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  body {
    font-family: 'Courier New', monospace;
    background: #0a0a0a;
    color: #e0e0e0;
  }
  #c { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    pointer-events: none;
    font-size: .95rem;
    letter-spacing: .1em;
  }
  .hud .score { background: rgba(0,0,0,.5); border: 1px solid #252525; border-radius: 8px; padding: 8px 12px; text-align: center; min-width: 74px; }
  .hud .score b { color: #00ff88; display: block; font-size: 1.3rem; }
  .hud .score span { color: #666; font-size: .7rem; }
  #msg {
    position: fixed;
    top: 12%; left: 50%; transform: translateX(-50%);
    z-index: 10;
    font-size: 1.5rem;
    font-weight: 700;
    color: #00ff88;
    text-shadow: 0 0 24px rgba(0,255,136,.6), 0 0 8px rgba(0,255,136,.8);
    letter-spacing: .12em;
    text-align: center;
    pointer-events: none;
    min-width: 200px;
  }
  #msg small { display: block; color: #888; font-size: .85rem; text-shadow: none; margin-top: 8px; }
  .hint {
    position: fixed;
    bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: .95rem; color: #999;
    text-align: center; pointer-events: none;
    letter-spacing: .08em;
  }
  .hint b { color: #00ff88; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="score"><b id="youScore">0</b><span>YOU</span></div>
  <div class="score"><b id="botScore">0</b><span>BOT</span></div>
</div>
<div id="msg">PICK YOUR WEAPON<small>tap a 3D weapon below</small></div>
<div class="hint">✊ beats ✌️ · ✌️ beats ✋ · ✋ beats ✊</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const msg = document.getElementById('msg');
const youScoreEl = document.getElementById('youScore');
const botScoreEl = document.getElementById('botScore');

let W = innerWidth, H = innerHeight;
function resize(){ W = innerWidth; H = innerHeight; cv.width = W; cv.height = H; }
resize(); addEventListener('resize', resize);

/* ---------- 3D math ---------- */
function rotX(p, a){ const c=Math.cos(a), s=Math.sin(a); return [p[0], p[1]*c-p[2]*s, p[1]*s+p[2]*c]; }
function rotY(p, a){ const c=Math.cos(a), s=Math.sin(a); return [p[0]*c+p[2]*s, p[1], -p[0]*s+p[2]*c]; }
function rotZ(p, a){ const c=Math.cos(a), s=Math.sin(a); return [p[0]*c-p[1]*s, p[0]*s+p[1]*c, p[2]]; }
function rotXYZ(p, rx, ry, rz){ return rotZ(rotY(rotX(p, rx), ry), rz); }

const CAM = 5.4, F = 1;
function project(v){ const d = Math.max(0.1, v[2] + CAM); const s = F*W/2 / d; return [ v[0]*s + W/2, v[1]*s + H*0.62 ]; }
function worldV(v, o, part){ // scale, rotate, translate
  let p = [v[0]*o.scale, v[1]*o.scale, v[2]*o.scale];
  const rz = o.rz + (part ? part.rz : 0);
  p = rotXYZ(p, o.rx, o.ry, rz);
  return [p[0]+o.x, p[1]+o.y, p[2]+o.z];
}

/* ---------- mesh builders ---------- */
function makeBox(cx,cy,cz,sx,sy,sz,col){
  const verts = [
    [cx-sx,cy-sy,cz-sz],[cx+sx,cy-sy,cz-sz],[cx+sx,cy+sy,cz-sz],[cx-sx,cy+sy,cz-sz],
    [cx-sx,cy-sy,cz+sz],[cx+sx,cy-sy,cz+sz],[cx+sx,cy+sy,cz+sz],[cx-sx,cy+sy,cz+sz]
  ];
  const faces = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
  return { verts, faces, cols: faces.map(()=>col) };
}

function makeRock(){
  const seg=7, verts=[], faces=[], cols=[];
  for(let v=0; v<=seg; v++) for(let u=0; u<=seg; u++){
    const th=u/seg*Math.PI*2, ph=v/seg*Math.PI;
    const r=1.1 + (Math.random()-0.5)*0.42;
    verts.push([r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th)]);
  }
  for(let v=0; v<seg; v++) for(let u=0; u<seg; u++){
    const a=v*(seg+1)+u, b=a+1, c=a+(seg+1), d=c+1;
    if(a===b || c===d) continue;
    faces.push([a,b,d,c]);
    const g=0.62+Math.random()*0.18;
    cols.push([g, g*0.8, g*0.68]);
  }
  return { verts, faces, cols };
}

function makePaper(){
  const g=14, w=1.55, h=1.05, verts=[], faces=[], cols=[];
  for(let y=0; y<=g; y++) for(let x=0; x<=g; x++){
    verts.push([(x/g-0.5)*w, (y/g-0.5)*h, 0]);
  }
  for(let y=0; y<g; y++) for(let x=0; x<g; x++){
    const a=y*(g+1)+x, b=a+1, c=a+(g+1), d=c+1;
    faces.push([a,b,d,c]);
    cols.push([0.92,0.9,0.83]);
  }
  return { verts, faces, cols };
}

function makeScissorsHalf(){
  const verts=[], faces=[], cols=[];
  function box(cx,cy,cz,sx,sy,sz,col){
    const b=makeBox(cx,cy,cz,sx,sy,sz,col);
    const o=verts.length;
    b.verts.forEach(v=>verts.push(v));
    b.faces.forEach(f=>faces.push(f.map(i=>o+i)));
    b.cols.forEach(c=>cols.push(c));
  }
  const blade=[0.82,0.86,0.92], red=[0.95,0.28,0.28], screw=[0.5,0.5,0.55];
  // one blade on +x, one handle ring on +x, pivot screw
  box(0.85,0,0,   0.6,0.05,0.02, blade);
  for(let i=0;i<14;i++){
    const a=i/14*Math.PI*2;
    box(0.3+Math.cos(a)*0.16, Math.sin(a)*0.16, 0, 0.035,0.035,0.035, red);
  }
  box(0,0,0.02, 0.07,0.07,0.07, screw);
  return { verts, faces, cols };
}
function mirrorMesh(m){ return { verts: m.verts.map(v=>[-v[0],v[1],v[2]]), faces: m.faces, cols: m.cols }; }

/* ---------- weapon objects (parts = [ {mesh, rz} ]) ---------- */
function makeWeapon(type){
  const o = { type, x:0, y:0.2, z:0, rx:0, ry:0, rz:0, scale:1, parts:[] };
  if(type==='rock')     o.parts = [ { mesh: makeRock(), rz:0 } ];
  else if(type==='paper') o.parts = [ { mesh: makePaper(), rz:0 } ];
  else {
    const L = { mesh: makeScissorsHalf(), rz:0.25 };
    const R = { mesh: mirrorMesh(makeScissorsHalf()), rz:-0.25 };
    o.parts = [L, R];
  }
  return o;
}

/* ---------- scene state ---------- */
const TYPES = ['rock','paper','scissors'];
const NAMES = { rock:'ROCK', paper:'PAPER', scissors:'SCISSORS' };
const BEATS = { rock:'scissors', paper:'rock', scissors:'paper' };

let state = 'select';         // select -> reveal -> clash -> result
let selected = null, botType = null;
let player = null, bot = null;
let t = 0;                    // phase timer
let phase = 0;                // reveal progress, clash progress
let impact = 0;               // impact flash
let shake = 0;
let result = null;            // 'win'|'lose'|'draw'
let you = 0, botN = 0;
let particles = [], confetti = [];

// selection weapons
const sel = TYPES.map((ty,i)=>{ const w=makeWeapon(ty); w.x = i===0?-1.7 : i===1?0 : 1.7; w.y=0.25; return w; });

/* ---------- audio ---------- */
let actx=null;
function beep(freq,dur,type='square',gain=0.08){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=gain;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function boom(){ beep(90,0.35,'sawtooth',0.2); beep(55,0.5,'triangle',0.25); }
function winChord(){ [440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,0.5,'triangle',0.09), i*60)); }
function tapSnd(){ beep(500,0.06,'square',0.06); }

/* ---------- FX ---------- */
function spawnParticles(x,y,z,n){
  for(let i=0;i<n;i++){
    particles.push({
      x, y, z,
      vx:(Math.random()-0.5)*0.9, vy:Math.random()*0.9+0.2, vz:(Math.random()-0.5)*0.9,
      life:0, ttl:0.7+Math.random()*0.5, size:2+Math.random()*4,
      col:['#00ff88','#fff','#ffd93d','#4f77ff'][Math.floor(Math.random()*4)]
    });
  }
}
function spawnConfetti(){
  for(let i=0;i<60;i++){
    confetti.push({
      x:Math.random()*W, y:-20-Math.random()*H*0.4,
      vy:2+Math.random()*4, r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      size:6+Math.random()*8,
      col:['#00ff88','#ff0','#f0f','#0ff','#ff6b6b','#ffd93d','#4f77ff'][Math.floor(Math.random()*7)]
    });
  }
}

/* ---------- battle ---------- */
function pickWeapon(ty){ player = makeWeapon(ty); bot = makeWeapon(botType); }

function startBattle(ty){
  selected = ty;
  botType = TYPES[Math.floor(Math.random()*3)];
  if(botType===ty) botType = TYPES[(Math.floor(Math.random()*3))]; // allow same (draw) actually
  pickWeapon(ty);
  player.x = ty==='rock'?-1.7 : ty==='paper'?0 : 1.7;
  player.y = 0.25;
  bot.x = ty==='rock'?1.7 : ty==='paper'?0 : -1.7;
  bot.y = 0.25; bot.z = 0.2; bot.ry = Math.PI; // face player
  state = 'reveal'; t=0; phase=0;
  tapSnd();
  msg.innerHTML = 'VS <b style="color:#fff">' + NAMES[ty] + '</b> vs <b style="color:#fff">' + NAMES[botType] + '</b><small>revealing…</small>';
}

function clash(){
  state='clash'; t=0; phase=0;
  msg.innerHTML = '⚔️ CLASH!';
  boom();
}

function resolve(){
  let res;
  if(selected===botType) res='draw';
  else if(BEATS[selected]===botType) res='win';
  else res='lose';
  result=res; state='result'; t=0; phase=0;
  impact=1; shake=1.4;
  spawnParticles(0,0.1,0, 90);
  if(res==='win'){ you++; youScoreEl.textContent=you; spawnConfetti(); winChord();
    msg.innerHTML = '🎉 YOU WIN!'; }
  else if(res==='lose'){ botN++; botScoreEl.textContent=botN;
    msg.innerHTML = '😅 BOT WINS'; }
  else { msg.innerHTML = '🤝 IT\'S A TIE'; }
  setTimeout(()=>{ state='select'; selected=null; bot=null; player=null; result=null;
    msg.innerHTML = 'PICK YOUR WEAPON<small>tap a 3D weapon below</small>';
  }, 2600);
}

/* ---------- main loop ---------- */
let last=performance.now(), time=0;
function frame(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now; time+=dt;
  ctx.clearRect(0,0,W,H);
  // bg
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05050a'); g.addColorStop(1,'#0c1020');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // starfield
  for(let i=0;i<60;i++){
    const sx=(i*97)%W, sy=(i*53)%H, tw=0.5+Math.sin(time*3+i)*0.5;
    ctx.fillStyle=`rgba(160,190,255,${0.2+0.5*tw})`;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  // shake
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake*9, (Math.random()-0.5)*shake*9); shake*=0.9; if(shake<0.05)shake=0; }

  drawFloor();
  drawWeapons();
  updateWorld(dt);
  drawParticles();
  ctx.restore();

  // impact flash
  if(impact>0){ ctx.fillStyle=`rgba(255,255,255,${Math.min(0.5,impact*0.5)})`; ctx.fillRect(0,0,W,H); impact*=0.92; if(impact<0.02)impact=0; }

  // confetti (screen space)
  confetti.forEach(c=>{ c.y+=c.vy; c.x+=Math.sin(time*6+c.r)*1.2; c.r+=c.vr; if(c.y>H+20){c.y=-20;c.x=Math.random()*W;} });
  confetti.forEach(c=>{ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.r); ctx.fillStyle=c.col; ctx.fillRect(-c.size/2,-c.size/4,c.size,c.size/2); ctx.restore(); });

  requestAnimationFrame(frame);
}

function drawFloor(){
  const cx=W/2, cy=H*0.62;
  // glow
  const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,H*0.35);
  rg.addColorStop(0,'rgba(0,255,136,0.35)'); rg.addColorStop(1,'rgba(0,255,136,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,H*0.35,0,Math.PI*2); ctx.fill();
  // grid lines on floor plane y=0
  ctx.strokeStyle='rgba(0,255,136,0.22)'; ctx.lineWidth=1;
  for(let gx=-2.6; gx<=2.6; gx+=0.65){
    const p0=project([gx,0,-1.8]), p1=project([gx,0,2.2]);
    line(p0,p1);
  }
  for(let gz=-1.8; gz<=2.2; gz+=0.65){
    const p0=project([-2.6,0,gz]), p1=project([2.6,0,gz]);
    line(p0,p1);
  }
  function line(a,b){ ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }
}

/* ---------- render 3D ---------- */
function drawObject(o, glow, selGlow){
  // paper wave
  o.parts.forEach(part=>{
    if(o.type==='paper'){
      part.mesh.verts.forEach((v,i)=>{ v[2] = Math.sin(v[0]*3.2 + time*1.6)*0.06 + Math.cos(v[1]*3.2 - time*1.2)*0.05; });
    }
  });
  // scissors snip
  if(o.type==='scissors'){
    o.parts[0].rz = 0.25 + Math.sin(time*5)*0.18;
    o.parts[1].rz = -0.25 - Math.sin(time*5)*0.18;
  }

  const faces=[];
  o.parts.forEach(part=>{
    const wv = part.mesh.verts.map(v=>worldV(v,o,part));
    part.mesh.faces.forEach((fi,fiIdx)=>{
      const vs=fi.map(i=>wv[i]);
      // face normal
      const a=vs[0],b=vs[1],c=vs[2];
      const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2];
      const vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const L=Math.hypot(nx,ny,nz)||1; nx/=L; ny/=L; nz/=L;
      // light
      const bri=Math.max(0.08, (nx*0.45+ny*0.75+nz*0.9));
      const col=part.mesh.cols[fiIdx];
      // average depth
      let d=0; vs.forEach(v=>d+=v[2]); d/=vs.length;
      faces.push({ d, pts: fi.map(i=>project(wv[i])), col:[col[0]*bri, col[1]*bri, col[2]*bri] });
    });
  });
  faces.sort((a,b)=>b.d-a.d);
  faces.forEach(f=>{
    ctx.fillStyle=`rgb(${f.col[0]*255|0},${f.col[1]*255|0},${f.col[2]*255|0})`;
    ctx.beginPath(); ctx.moveTo(f.pts[0][0],f.pts[0][1]);
    for(let i=1;i<f.pts.length;i++) ctx.lineTo(f.pts[i][0],f.pts[i][1]);
    ctx.closePath(); ctx.fill();
  });
  // glow ring for selection highlight
  if(selGlow){
    const c=project([o.x,o.y+0.5,o.z]);
    ctx.strokeStyle='rgba(0,255,136,0.8)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(c[0],c[1],26,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(0,255,136,0.25)'; ctx.lineWidth=8;
    ctx.beginPath(); ctx.arc(c[0],c[1],26,0,Math.PI*2); ctx.stroke();
  }
}

function drawWeapons(){
  if(state==='select'){
    sel.forEach((o,i)=>{
      const bobY = 0.25 + Math.sin(time*2 + i*1.4)*0.08;
      o.y = bobY; o.ry = time*1.6 + i*2.1;
      drawObject(o, false, i===Math.floor((time*8)%3));
    });
  } else {
    // player & bot
    if(player) drawObject(player, player===resultWin()&&result==='win', false);
    if(bot) drawObject(bot, bot===resultWin()&&result==='lose', false);
  }
}
function resultWin(){ return state==='result' && (result==='win'||result==='lose') ? (result==='win'?player:bot) : null; }

function updateWorld(dt){
  // reveal phase: fly player to left slot, bot to right slot
  if(state==='reveal'){
    phase += dt*2.2; if(phase>1) phase=1;
    const e=phase;
    // player: from select pos -> left slot
    const sx = selected==='rock'?-1.7 : selected==='paper'?0 : 1.7;
    player.x = lerp(sx, -2.0, e);
    player.ry = lerp(0, 0, e);
    player.rz += dt*2;
    // bot: from offscreen right -> right slot
    bot.x = lerp(3.0, 2.0, e);
    bot.z = lerp(0.6, 0.2, e);
    bot.ry = lerp(Math.PI, Math.PI, e);
    bot.rz += dt*2;
    if(phase>=1){ state='clash'; t=0; phase=0; clash(); }
  }
  // clash: both charge to center
  else if(state==='clash'){
    phase += dt*2.6; if(phase>1) phase=1;
    const e=phase;
    player.x = lerp(-2.0, 0.0, e); player.y = lerp(0.25, 0.1, e);
    bot.x    = lerp( 2.0, 0.0, e); bot.y    = lerp(0.25, 0.1, e);
    player.ry += dt*8; bot.ry -= dt*8;
    player.rz += dt*6; bot.rz -= dt*6;
    if(phase>=1){ resolve(); }
  }
  // result: winner spins center, loser shatters (move loser away + shrink)
  else if(state==='result'){
    const winner = result==='win' ? player : result==='lose' ? bot : null;
    if(winner){
      winner.x = 0; winner.y = 0.25 + Math.sin(time*3)*0.12;
      winner.ry += dt*5; winner.rz += dt*2;
      const loser = result==='win' ? bot : result==='lose' ? player : null;
      if(loser){ loser.x += dt*4; loser.scale -= dt*2.5; loser.y -= dt*1.2; }
    }
  }

  // particles
  particles.forEach(p=>{
    p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vy-=0.6*dt;
  });
  particles=particles.filter(p=>p.life<p.ttl && p.y<1.5);
}
function lerp(a,b,e){ return a+(b-a)*e; }

function drawParticles(){
  particles.forEach(p=>{
    const c=project([p.x,p.y,p.z]);
    ctx.globalAlpha=1-p.life/p.ttl;
    ctx.fillStyle=p.col;
    ctx.fillRect(c[0]-p.size/2, c[1]-p.size/2, p.size, p.size);
    ctx.globalAlpha=1;
  });
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown', e=>{
  const x=e.clientX, y=e.clientY;
  if(state==='select'){
    // find nearest selection weapon by projected screen x
    let best=null, bd=1e9;
    sel.forEach((o,i)=>{
      const c=project([o.x, o.y, o.z]);
      const d=Math.abs(c[0]-x);
      if(d<bd && Math.abs(c[1]-y)<W*0.5){ bd=d; best=i; }
    });
    if(best!==null) startBattle(TYPES[best]);
  }
});

requestAnimationFrame(frame);
</script>
</body>
</html>
