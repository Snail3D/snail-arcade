<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rock Paper Scissors 3D — Arena Battle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #e0e0e0; }
  #c { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px; pointer-events: none; gap: 10px;
  }
  .panel {
    background: rgba(0,0,0,.55); border: 1px solid #252525; border-radius: 8px;
    padding: 8px 12px; min-width: 92px; letter-spacing: .08em;
  }
  .panel b { color: #00ff88; font-size: 1.25rem; display: block; }
  .panel span { color: #666; font-size: .7rem; }
  .dots { display: flex; gap: 4px; margin-top: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #444; background: #222; }
  .dot.on { background: #00ff88; border-color: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,.8); }
  .streak { text-align: center; flex: 1; }
  .streak b { color: #ffd93d; font-size: 1.1rem; }
  .streak span { color: #888; font-size: .68rem; }
  #msg {
    position: fixed; top: 16%; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 1.6rem; font-weight: 700; color: #00ff88;
    text-shadow: 0 0 24px rgba(0,255,136,.6); letter-spacing: .12em; text-align: center;
    pointer-events: none; min-width: 240px;
  }
  #msg small { display: block; color: #888; font-size: .85rem; text-shadow: none; margin-top: 8px; }
  .controls {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; gap: 10px; align-items: center;
  }
  .controls .hint { font-size: .9rem; color: #999; letter-spacing: .08em; }
  .controls .hint b { color: #00ff88; }
  .modeBtn {
    background: transparent; border: 1px solid #333; border-radius: 8px; color: #888;
    padding: 8px 14px; font-family: 'Courier New', monospace; font-size: .78rem; cursor: pointer;
    letter-spacing: .08em;
  }
  .modeBtn.active { border-color: #00ff88; color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,.4); }
  .modeBtn:active { background: #242424; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="panel">
    <b id="youScore">0</b><span>YOU</span>
    <div class="dots" id="youDots"></div>
  </div>
  <div class="streak"><b id="streakEl">🔥 0</b><span>WIN STREAK · BEST <b id="bestEl" style="color:#ffd93d">0</b></span></div>
  <div class="panel">
    <b id="botScore">0</b><span>BOT</span>
    <div class="dots" id="botDots"></div>
  </div>
</div>
<div id="msg">WELCOME TO THE ARENA<small>pick your weapon below</small></div>
<div class="controls">
  <div class="hint">✊ beats ✌️ · ✌️ beats ✋ · ✋ beats ✊</div>
  <button class="modeBtn" id="modeBtn">BEST OF 5</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const msg = document.getElementById('msg');
const youScoreEl = document.getElementById('youScore');
const botScoreEl = document.getElementById('botScore');
const youDotsEl = document.getElementById('youDots');
const botDotsEl = document.getElementById('botDots');
const streakEl = document.getElementById('streakEl');
const bestEl = document.getElementById('bestEl');
const modeBtn = document.getElementById('modeBtn');

let W = innerWidth, H = innerHeight;
function resize(){ W = innerWidth; H = innerHeight; cv.width = W; cv.height = H; }
resize(); addEventListener('resize', resize);

/* ============ VECTOR / 3D MATH ============ */
function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function add(a,b){ return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function mul(a,s){ return [a[0]*s, a[1]*s, a[2]*s]; }
function norm(a){ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function rotX(p,a){ const c=Math.cos(a),s=Math.sin(a); return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c]; }
function rotY(p,a){ const c=Math.cos(a),s=Math.sin(a); return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c]; }
function rotZ(p,a){ const c=Math.cos(a),s=Math.sin(a); return [p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]]; }
function rotXYZ(p,rx,ry,rz){ return rotZ(rotY(rotX(p,rx),ry),rz); }

/* ============ CAMERA (orbit + look-at) ============ */
const cam = { dist: 5.6, height: 1.7, angle: 0.35, targetY: 0.18, f: 1.0 };
function camPos(){ return [Math.sin(cam.angle)*cam.dist, cam.height, Math.cos(cam.angle)*cam.dist]; }
function project(P){
  const C = camPos();
  const T = [0, cam.targetY, 0];
  const fwd = norm(sub(T, C));
  const right = norm(cross(fwd, [0,1,0]));
  const up = cross(right, fwd);
  const rel = sub(P, C);
  const depth = Math.max(0.15, dot(rel, fwd));
  const s = (cam.f * W/2) / depth;
  return [ dot(rel, right)*s + W/2, dot(rel, up)*s + H*0.60 ];
}

/* ============ MESH BUILDERS ============ */
function makeBox(cx,cy,cz,sx,sy,sz,col){
  const verts = [
    [cx-sx,cy-sy,cz-sz],[cx+sx,cy-sy,cz-sz],[cx+sx,cy+sy,cz-sz],[cx-sx,cy+sy,cz-sz],
    [cx-sx,cy-sy,cz+sz],[cx+sx,cy-sy,cz+sz],[cx+sx,cy+sy,cz+sz],[cx-sx,cy+sy,cz+sz]
  ];
  const faces = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
  return { verts, faces, cols: faces.map(()=>col) };
}

function makeRock(){
  const seg=8, verts=[], faces=[], cols=[];
  for(let v=0; v<=seg; v++) for(let u=0; u<=seg; u++){
    const th=u/seg*Math.PI*2, ph=v/seg*Math.PI;
    let r=1.08 + (Math.random()-0.5)*0.5;
    // add a few sharp spikes for menace
    if(Math.random()<0.05) r += 0.35;
    verts.push([r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th)]);
  }
  for(let v=0; v<seg; v++) for(let u=0; u<seg; u++){
    const a=v*(seg+1)+u, b=a+1, c=a+(seg+1), d=c+1;
    if(a===b || c===d) continue;
    faces.push([a,b,d,c]);
    const g=0.6+Math.random()*0.22;
    cols.push([g, g*0.8, g*0.66]);
  }
  return { verts, faces, cols };
}

function makePaperGrid(sign, grid, w, h){
  const verts=[], faces=[], cols=[];
  for(let y=0; y<=grid; y++){
    const py = sign>0 ? (y/grid)*0.5*h : -(y/grid)*0.5*h;
    for(let x=0; x<=grid; x++){
      verts.push([(x/grid-0.5)*w, py, 0]);
    }
  }
  for(let y=0; y<grid; y++) for(let x=0; x<grid; x++){
    const a=y*(grid+1)+x, b=a+1, c=a+(grid+1), d=c+1;
    faces.push([a,b,d,c]);
    cols.push([0.92,0.9,0.83]);
  }
  return { verts, faces, cols };
}
function makePaper(){ return makePaperGrid(1, 14, 1.55, 1.05); }
function makePaperHalf(sign){ return makePaperGrid(sign, 9, 1.55, 1.05); }

function makeScissorsHalf(zoff){
  const verts=[], faces=[], cols=[];
  function box(cx,cy,cz,sx,sy,sz,col){
    const b=makeBox(cx,cy,cz,sx,sy,sz,col), o=verts.length;
    b.verts.forEach(v=>verts.push(v));
    b.faces.forEach(f=>faces.push(f.map(i=>o+i)));
    b.cols.forEach(c=>cols.push(c));
  }
  const blade=[0.82,0.86,0.92], red=[0.95,0.28,0.28], screw=[0.5,0.5,0.55];
  // one blade pointing +x (tip forward), one handle ring behind at -x, pivot screw
  box(0.85,0,zoff,   0.6,0.05,0.02, blade);              // blade x 0.25..1.45
  for(let i=0;i<14;i++){
    const a=i/14*Math.PI*2;
    box(-0.28+Math.cos(a)*0.16, Math.sin(a)*0.16, zoff, 0.035,0.035,0.035, red); // handle ring
  }
  box(0,0,0.02, 0.07,0.07,0.07, screw);
  return { verts, faces, cols };
}

/* ============ WEAPON OBJECTS ============ */
function makeWeapon(type){
  const o = { type, x:0, y:0.25, z:0, rx:0, ry:0, rz:0, scale:1, parts:[], trail:[] };
  if(type==='rock')      o.parts = [ { mesh: makeRock(), rz:0 } ];
  else if(type==='paper') o.parts = [ { mesh: makePaper(), rz:0 } ];
  else {
    // two blades BOTH pointing +x, offset in z so they cross at the pivot (real scissors)
    o.parts = [ { mesh: makeScissorsHalf(0), rz:0.32 }, { mesh: makeScissorsHalf(0.05), rz:-0.32 } ];
  }
  return o;
}

/* ============ STATE ============ */
const TYPES = ['rock','paper','scissors'];
const NAMES = { rock:'ROCK', paper:'PAPER', scissors:'SCISSORS' };
const BEATS = { rock:'scissors', paper:'rock', scissors:'paper' };
const COLORS = { rock:'#ffb347', paper:'#f0e8d8', scissors:'#8fd6ff' };

let state = 'intro';       // intro -> select -> reveal -> charge -> impact -> finish -> result
let selected = null, botType = null;
let player = null, bot = null;
let phase = 0;              // phase progress 0..1
let impact = 0, shake = 0;
let result = null;
let hitStop = 0, slowMo = 0;
let particles = [], confetti = [], trails = [];
let time = 0;

// match / streak
let matchMode = true;
let youWins = 0, botWins = 0;   // current match round-wins
let youTotal = 0, botTotal = 0; // lifetime
let streak = 0;
let bestStreak = +(localStorage.getItem('rps_best')||0);
bestEl.textContent = bestStreak;
updateDots();

// selection weapons
const sel = TYPES.map((ty,i)=>{
  const w = makeWeapon(ty);
  w.x = i===0 ? -1.75 : i===1 ? 0 : 1.75;
  w.y = 0.3;
  return w;
});

/* ============ AUDIO (soft, enveloped) ============ */
let actx=null, master=null;
function ensureAudio(){
  if(!actx){
    actx = new (window.AudioContext||window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.5;
    master.connect(actx.destination);
  }
}
function tone(freq, dur, type, vol, slide){
  try{
    ensureAudio();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq+slide), actx.currentTime+dur);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.06, actx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(actx.currentTime+dur+0.05);
  }catch(e){}
}
function boom(){ tone(150,0.55,'sine',0.15,-100); tone(70,0.8,'sine',0.12,-25); }
function whoosh(){ tone(180,0.45,'triangle',0.06,120); }
function fanfare(){ [330,415,494,660].forEach((f,i)=>setTimeout(()=>tone(f,0.5,'sine',0.06), i*70)); }
function matchFanfare(){ [392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.6,'sine',0.07), i*80)); }
function loseSnd(){ [330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.55,'sine',0.05), i*90)); }
function tapSnd(){ tone(620,0.08,'sine',0.05,40); }
function snipSnd(){ tone(1500,0.07,'triangle',0.05); tone(1050,0.07,'triangle',0.04); }

/* ============ FX ============ */
function spawnParticles(p,n,spread,up){
  for(let i=0;i<n;i++){
    particles.push({
      x:p[0], y:p[1], z:p[2],
      vx:(Math.random()-0.5)*spread, vy:Math.random()*up+0.2, vz:(Math.random()-0.5)*spread,
      life:0, ttl:0.7+Math.random()*0.5, size:2+Math.random()*4,
      col:['#00ff88','#fff','#ffd93d','#4f77ff','#ff6b6b'][Math.floor(Math.random()*5)]
    });
  }
}
function spawnConfetti(){
  for(let i=0;i<50;i++) confetti.push({
    x:Math.random()*W, y:-20-Math.random()*H*0.4, vy:2+Math.random()*4,
    r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3, size:6+Math.random()*8, life:0,
    col:['#00ff88','#ff0','#f0f','#0ff','#ff6b6b','#ffd93d','#4f77ff'][Math.floor(Math.random()*7)]
  });
}
function addTrail(o){ o.trail.push([o.x,o.y,o.z]); if(o.trail.length>26) o.trail.shift(); }

/* ============ GAME FLOW ============ */
function updateDots(){
  const mk = (n,on)=> Array.from({length:n},(_,i)=>`<div class="dot${i<on?' on':''}"></div>`).join('');
  youDotsEl.innerHTML = mk(5, youWins);
  botDotsEl.innerHTML = mk(5, botWins);
}
function streakUp(){
  streakEl.textContent = '🔥 '+streak;
  if(streak>bestStreak){ bestStreak=streak; bestEl.textContent=bestStreak; localStorage.setItem('rps_best',bestStreak); }
}

function startBattle(ty){
  selected = ty;
  botType = TYPES[Math.floor(Math.random()*3)];
  player = makeWeapon(ty);
  bot = makeWeapon(botType);
  player.x = ty==='rock'?-1.75 : ty==='paper'?0 : 1.75; player.y=0.3;
  bot.x = ty==='rock'?1.75 : ty==='paper'?0 : -1.75; bot.y=0.3; bot.z=0.2; bot.ry=Math.PI;
  state='reveal'; phase=0;
  tapSnd();
  msg.innerHTML = `VS <b style="color:${COLORS[ty]}">${NAMES[ty]}</b> vs <b style="color:${COLORS[botType]}">${NAMES[botType]}</b><small>revealing…</small>`;
}

function charge(){ state='charge'; phase=0; whoosh(); }

function impactNow(){
  state='impact'; phase=0;
  impact=1; shake=1.6; hitStop=0.11; slowMo=1;
  boom();
  spawnParticles([0,0.15,0], 110, 1.4, 1.1);
  cam.dist += 0.55; // zoom punch
}

function resolveRound(){
  let res;
  if(selected===botType) res='draw';
  else if(BEATS[selected]===botType) res='win';
  else res='lose';
  result = res;
  state='finish'; phase=0;
  youScoreEl.textContent = youTotal;
  botScoreEl.textContent = botTotal;
  if(res==='win'){ youWins++; youTotal++; streak++; streakUp(); }
  else if(res==='lose'){ botWins++; botTotal++; streak=0; streakUp(); }
  updateDots();
  // themed callouts
  if(res==='win'){
    const w=selected, l=botType;
    const line = w==='rock' ? 'ROCK CRUSHES SCISSORS!' : w==='scissors' ? 'SCISSORS CUTS PAPER!' : 'PAPER COVERS ROCK!';
    msg.innerHTML = `🎉 YOU WIN — <b style="color:${COLORS[w]}">${NAMES[w]}</b> ${line}<small>keep your streak alive!</small>`;
    spawnConfetti();
  } else if(res==='lose'){
    const w=botType;
    const line = w==='rock' ? 'ROCK CRUSHES SCISSORS!' : w==='scissors' ? 'SCISSORS CUTS PAPER!' : 'PAPER COVERS ROCK!';
    msg.innerHTML = `😅 BOT WINS — <b style="color:${COLORS[w]}">${NAMES[w]}</b> ${line}<small>streak broken!</small>`;
  } else {
    msg.innerHTML = '🤝 IT\'S A TIE<small>both recoil!</small>';
  }
  // schedule next round
  const wait = matchMode ? 2600 : 2400;
  setTimeout(()=>{
    if(matchMode && (youWins>=3 || botWins>=3)){
      const youWon = youWins>=3;
      if(youWon){
        msg.innerHTML = `🏆 YOU WIN THE MATCH!<small>best of 5 — first to 3</small>`;
        matchFanfare();
      } else {
        msg.innerHTML = `💀 BOT WINS THE MATCH<small>best of 5 — first to 3</small>`;
        loseSnd();
      }
      setTimeout(()=>{ youWins=0; botWins=0; updateDots(); toSelect(); }, 3200);
    } else {
      toSelect();
    }
  }, wait);
}

function toSelect(){
  state='select'; selected=null; player=null; bot=null; result=null; trails=[];
  msg.innerHTML = 'PICK YOUR WEAPON<small>tap a 3D weapon below</small>';
}

/* ============ MAIN LOOP ============ */
let last=performance.now();
function frame(now){
  let dt = Math.min(0.05, (now-last)/1000); last=now;

  // hit-stop / slow-mo
  if(hitStop>0){ hitStop-=dt; dt=0; }
  else if(slowMo>0){ slowMo-=dt*2.6; dt *= (1 - slowMo*0.85); if(slowMo<0)slowMo=0; }

  time += dt;
  ctx.clearRect(0,0,W,H);
  bg();
  if(state==='intro' && time>2.4){ toSelect(); }
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake*9,(Math.random()-0.5)*shake*9); shake*=0.9; if(shake<0.05)shake=0; }
  updateCamera(dt);
  drawFloor();
  updateWorld(dt);
  drawObjects();
  drawTrails();
  drawParticles();
  ctx.restore();

  // flash
  if(impact>0){ ctx.fillStyle=`rgba(255,255,255,${Math.min(0.5,impact*0.5)})`; ctx.fillRect(0,0,W,H); impact*=0.92; if(impact<0.02)impact=0; }
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // confetti screen-space
  confetti.forEach(c=>{ c.y+=c.vy; c.x+=Math.sin(time*6+c.r)*1.2; c.r+=c.vr; c.life+=dt; });
  confetti = confetti.filter(c=> c.y<H+30 && c.life<4.5);
  confetti.forEach(c=>{ ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.r); ctx.fillStyle=c.col; ctx.fillRect(-c.size/2,-c.size/4,c.size,c.size/2); ctx.restore(); });

  requestAnimationFrame(frame);
}

function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05050a'); g.addColorStop(1,'#0c1020');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){
    const sx=(i*97)%W, sy=(i*53)%H, tw=0.5+Math.sin(time*3+i)*0.5;
    ctx.fillStyle=`rgba(160,190,255,${0.15+0.4*tw})`;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
}

function updateCamera(dt){
  if(state==='intro'){
    cam.angle += dt*0.4;
    cam.dist += (5.6-cam.dist)*dt*2;
    cam.height += (1.7-cam.height)*dt*2;
  } else if(state==='select'){
    cam.angle += (0.3-cam.angle)*dt*2;
    cam.dist += (5.6-cam.dist)*dt*2;
  } else if(state==='charge'){
    cam.angle += dt*0.7;
  } else if(state==='impact'){
    cam.dist += (5.6-cam.dist)*dt*3;
  } else if(state==='finish'||state==='result'){
    cam.angle += dt*0.3;
  }
}

function drawFloor(){
  const cx=W/2, cy=H*0.60;
  const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,H*0.4);
  rg.addColorStop(0,'rgba(0,255,136,0.4)'); rg.addColorStop(1,'rgba(0,255,136,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,H*0.4,0,Math.PI*2); ctx.fill();
  // checker grid
  ctx.lineWidth=1;
  for(let gx=-2.6; gx<=2.6; gx+=0.55){
    const a=project([gx,0,-1.9]), b=project([gx,0,2.3]);
    ctx.strokeStyle='rgba(0,255,136,0.22)';
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  for(let gz=-1.9; gz<=2.3; gz+=0.55){
    const a=project([-2.6,0,gz]), b=project([2.6,0,gz]);
    ctx.strokeStyle='rgba(0,255,136,0.22)';
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
}

function drawObjects(){
  if(state==='intro' || state==='select'){
    sel.forEach((o,i)=>{
      const bob = 0.3 + Math.sin(time*2 + i*1.4)*0.1;
      o.y = bob; o.ry = time*1.7 + i*2.1;
      drawObject(o, false, state==='select' && i===Math.floor((time*8)%3));
    });
  } else {
    if(player) drawObject(player, false, false);
    if(bot) drawObject(bot, false, false);
  }
}

function drawObject(o, glow, selGlow){
  o.parts.forEach(part=>{
    if(o.type==='paper'){
      part.mesh.verts.forEach((v,i)=>{ v[2] = Math.sin(v[0]*3.2+time*1.6)*0.06 + Math.cos(v[1]*3.2-time*1.2)*0.05; });
    }
  });
  if(o.type==='scissors'){
    o.parts[0].rz = 0.3 + Math.sin(time*5)*0.18;
    o.parts[1].rz = -0.3 - Math.sin(time*5)*0.18;
  }

  const faces=[];
  o.parts.forEach(part=>{
    const wv = part.mesh.verts.map(v=>rotXYZ(v,o.rx,o.ry,part.rz).map((c,i)=> c*o.scale + [o.x,o.y,o.z][i]));
    part.mesh.faces.forEach((fi,fiIdx)=>{
      const vs=fi.map(i=>wv[i]);
      const a=vs[0],b=vs[1],c=vs[2];
      const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2];
      const vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const L=Math.hypot(nx,ny,nz)||1; nx/=L; ny/=L; nz/=L;
      const bri=Math.max(0.08,(nx*0.45+ny*0.75+nz*0.9));
      const col=part.mesh.cols[fiIdx];
      let d=0; vs.forEach(v=>d+=v[2]); d/=vs.length;
      faces.push({ d, pts: fi.map(i=>project(wv[i])), col:[col[0]*bri,col[1]*bri,col[2]*bri] });
    });
  });
  faces.sort((a,b)=>b.d-a.d);
  faces.forEach(f=>{
    ctx.fillStyle=`rgb(${f.col[0]*255|0},${f.col[1]*255|0},${f.col[2]*255|0})`;
    ctx.beginPath(); ctx.moveTo(f.pts[0][0],f.pts[0][1]);
    for(let i=1;i<f.pts.length;i++) ctx.lineTo(f.pts[i][0],f.pts[i][1]);
    ctx.closePath(); ctx.fill();
  });
  if(selGlow){
    const c=project([o.x,o.y+0.6,o.z]);
    ctx.strokeStyle='rgba(0,255,136,0.25)'; ctx.lineWidth=9;
    ctx.beginPath(); ctx.arc(c[0],c[1],24,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(0,255,136,0.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(c[0],c[1],24,0,Math.PI*2); ctx.stroke();
  }
}

function updateWorld(dt){
  // selection idle bobbing handled in drawObjects
  if(state==='reveal'){
    phase += dt*2.2; if(phase>1) phase=1;
    const e=phase;
    const sx = selected==='rock'?-1.75 : selected==='paper'?0 : 1.75;
    player.x = lerp(sx, -2.05, e); player.y = lerp(0.3,0.3,e); player.rz += dt*2;
    bot.x = lerp(3.1, 2.05, e); bot.z = lerp(0.6,0.2,e); bot.rz += dt*2;
    addTrail(player); addTrail(bot);
    if(phase>=1) charge();
  }
  else if(state==='charge'){
    phase += dt*2.8; if(phase>1) phase=1;
    const e=phase;
    player.x = lerp(-2.05, 0, e); player.y = lerp(0.3, 0.12, e);
    bot.x    = lerp( 2.05, 0, e); bot.y    = lerp(0.3, 0.12, e);
    player.ry += dt*8; bot.ry -= dt*8; player.rz += dt*5; bot.rz -= dt*5;
    addTrail(player); addTrail(bot);
    if(phase>=1) impactNow();
  }
  else if(state==='impact'){
    phase += dt*1.4; if(phase>1) phase=1;
    // recoil both out
    player.x = lerp(0, -0.5, phase); bot.x = lerp(0, 0.5, phase);
    player.y = lerp(0.12, 0.3, phase); bot.y = lerp(0.12, 0.3, phase);
    addTrail(player); addTrail(bot);
    if(phase>=1) resolveRound();
  }
  else if(state==='finish'){
    phase += dt*1.1; if(phase>1) phase=1;
    themedFinish(dt);
  }
  else if(state==='result'){
    // handled by resolveRound scheduling -> toSelect
  }
  particles.forEach(p=>{ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vy-=0.6*dt; });
  particles = particles.filter(p=>p.life<p.ttl && p.y<1.6);
}

function lerp(a,b,e){ return a+(b-a)*e; }

/* ============ THEMED FINISHES ============ */
let paperHalves = null;
function themedFinish(dt){
  if(result==='draw'){
    player.x = lerp(-0.5, -1.6, phase); player.y = lerp(0.3, 0.35, phase);
    bot.x = lerp(0.5, 1.6, phase); bot.y = lerp(0.3, 0.35, phase);
    player.rz += dt*3; bot.rz += dt*3;
    return;
  }
  const win = result==='win' ? player : bot;
  const lose = result==='win' ? bot : player;

  // winner themed action
  if(win.type==='rock' && lose.type==='scissors'){
    // rock slams down on scissors
    if(phase<0.5){
      win.x = 0; win.y = lerp(0.3, 1.5, phase/0.5); win.rz += dt*3;
      lose.x = lerp(0.5, 0.1, phase/0.5); lose.y = 0.15; lose.rz -= dt*3;
    } else {
      win.y = lerp(1.5, 0.12, (phase-0.5)/0.5);
      if((phase-0.5)<0.02){ impact=0.7; shake=1; spawnParticles([0,0.15,0],40,1.2,0.8); boom(); }
      lose.scale -= dt*2.4; lose.y -= dt*1.2; lose.x += dt*1.5;
    }
  }
  else if(win.type==='scissors' && lose.type==='paper'){
    // scissors snips paper in half
    if(phase<0.45){
      win.x = lerp(0.5, 0, phase/0.45); win.y = lerp(0.3, 0.2, phase/0.45);
      win.rz += dt*6;
      lose.x = lerp(-0.5, 0, phase/0.45); lose.y = 0.2;
    } else {
      if(paperHalves===null){
        paperHalves = [ makeWeapon('paper'), makeWeapon('paper') ];
        // split into two halves
        const top = makePaperHalf(1), bot = makePaperHalf(-1);
        paperHalves[0].parts = [{ mesh: top, rz:0 }];
        paperHalves[1].parts = [{ mesh: bot, rz:0 }];
        paperHalves[0].y = lose.y; paperHalves[1].y = lose.y;
        paperHalves[0].x = 0; paperHalves[1].x = 0;
        lose.scale = 0; // hide original
        snipSnd(); spawnParticles([0,0.2,0],30,1.0,0.6);
      }
      win.rz += dt*10; // fast snip
      const e=(phase-0.45)/0.55;
      paperHalves[0].x = lerp(0, 0.7, e); paperHalves[0].y = lerp(0.2, 0.7, e); paperHalves[0].rz = e*1.2;
      paperHalves[1].x = lerp(0, -0.7, e); paperHalves[1].y = lerp(0.2, 0.5, e); paperHalves[1].rz = -e*1.2;
    }
  }
  else if(win.type==='paper' && lose.type==='rock'){
    // paper wraps over rock
    if(phase<0.6){
      win.x = lerp(-0.5, 0, phase/0.6); win.y = lerp(0.3, 1.4, phase/0.6);
      win.rz += dt*4;
      lose.x = lerp(0.5, 0, phase/0.6); lose.y = 0.15; lose.rz += dt*4;
    } else {
      const e=(phase-0.6)/0.4;
      win.y = lerp(1.4, 0.3, e); win.x = 0; win.rx = lerp(0, 1.45, e); // tilt flat over rock
      lose.y = lerp(0.15, -0.15, e); lose.scale -= dt*1.6;
      if(e<0.03){ impact=0.5; spawnParticles([0,0.1,0],40,1.2,0.6); boom(); }
    }
  }
  else if(win.type==='scissors' && lose.type==='rock'){
    // scissors snips, rock shatters
    win.x = lerp(-0.5, 0, phase); win.y = lerp(0.3, 0.2, phase); win.rz += dt*10;
    lose.x = lerp(0.5, 0.2, phase); lose.y = 0.15; lose.scale -= dt*2.6; lose.y -= dt*1.2;
  }
  else if(win.type==='rock' && lose.type==='paper'){
    // rock smashes paper
    win.x = lerp(0.5, 0, phase); win.y = lerp(0.3, 1.4, phase); win.rz += dt*3;
    lose.x = lerp(-0.5, 0.1, phase); lose.y = 0.2;
    if(phase>0.6){ win.y = lerp(1.4, 0.12, (phase-0.6)/0.4); if((phase-0.6)<0.02){impact=0.6;spawnParticles([0,0.15,0],40,1.2,0.8);boom();} lose.scale -= dt*2; }
  }
  else if(win.type==='paper' && lose.type==='scissors'){
    // paper wraps, scissors falls
    win.x = lerp(-0.5, 0, phase); win.y = lerp(0.3, 1.3, phase); win.rz += dt*4;
    lose.x = lerp(0.5, 0.15, phase); lose.y = 0.15; lose.rz -= dt*6; lose.scale -= dt*2;
  }
  if(phase>=1 && state==='finish') state='result';
}

function drawTrails(){
  trails.forEach(tr=>{ // tr = {pts, color}
    for(let i=1;i<tr.pts.length;i++){
      const a=project(tr.pts[i-1]), b=project(tr.pts[i]);
      ctx.strokeStyle=tr.color; ctx.globalAlpha=0.5;
      ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
      ctx.globalAlpha=1;
    }
  });
}

function drawParticles(){
  particles.forEach(p=>{
    const c=project([p.x,p.y,p.z]);
    ctx.globalAlpha=1-p.life/p.ttl;
    ctx.fillStyle=p.col;
    ctx.fillRect(c[0]-p.size/2, c[1]-p.size/2, p.size, p.size);
    ctx.globalAlpha=1;
  });
}

/* ============ INPUT ============ */
cv.addEventListener('pointerdown', e=>{
  const x=e.clientX, y=e.clientY;
  if(state==='select'){
    let best=null, bd=1e9;
    sel.forEach((o,i)=>{
      const c=project([o.x, o.y, o.z]);
      const d=Math.abs(c[0]-x);
      if(d<bd && Math.abs(c[1]-y)<W*0.5){ bd=d; best=i; }
    });
    if(best!==null) startBattle(TYPES[best]);
  }
});

modeBtn.addEventListener('click', ()=>{
  matchMode = !matchMode;
  modeBtn.textContent = matchMode ? 'BEST OF 5' : 'QUICK';
  modeBtn.classList.toggle('active', matchMode);
  youWins=0; botWins=0; updateDots();
});

requestAnimationFrame(frame);
</script>
