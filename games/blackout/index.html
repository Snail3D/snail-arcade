<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BLACKOUT — Power's Out | Snail Arcade</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #04050a;
    font-family: 'Courier New', monospace;
    color: #ffd98a;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 14px 20px; pointer-events: none;
    font-size: 18px; letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0,0,0,.8);
  }
  .bar {
    width: 240px; height: 16px; margin-top: 4px;
    background: #1a1a22; border: 1px solid #555;
    border-radius: 3px; overflow: hidden;
  }
  .bar > div { height: 100%; background: linear-gradient(90deg,#ffe9a8,#ff9d3f); width: 100%; }
  #msg {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%);
    text-align: center; pointer-events: none; font-size: 26px; line-height: 1.5;
    text-shadow: 0 0 12px rgba(0,0,0,.9); white-space: pre-line;
  }
  #overlay {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(2,3,8,.82); text-align: center;
  }
  .title { font-size: 64px; letter-spacing: 6px; text-shadow: 0 0 22px #ff9d3f; }
  .sub { font-size: 20px; color: #8a93a6; margin: 14px 0 28px; }
  .btn {
    background: #1c1f2c; color: #ffd98a; border: 2px solid #ff9d3f;
    padding: 14px 26px; font-family: 'Courier New', monospace;
    font-size: 20px; cursor: pointer; border-radius: 6px; letter-spacing: 2px;
    touch-action: manipulation;
  }
  .btn:hover { background: #2a2f44; box-shadow: 0 0 18px #ff9d3f; }
  .rules { font-size: 14px; color: #9aa0b3; max-width: 560px; margin-top: 26px; line-height: 1.7; }
  .k { color:#ffd98a; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div>
      <div>CANDLES <span id="candleCount">0</span></div>
      <div class="bar"><div id="candleBar"></div></div>
    </div>
    <div style="text-align:right">
      <div>BATTERY</div>
      <div class="bar"><div id="batBar"></div></div>
    </div>
  </div>
  <div id="msg"></div>
  <div id="overlay">
    <div class="title">BLACKOUT</div>
    <div class="sub">THE POWER IS OUT. FIND THE BREAKER. STAY IN THE LIGHT.</div>
    <button class="btn" id="startBtn">▶ START</button>
    <div class="rules">
      <div><span class="k">WASD / ARROWS</span> — move your flashlight</div>
      <div><span class="k">CANDLES</span> — collect them to keep your light alive</div>
      <div><span class="k">THE DARK</span> — shadows hunt in it. They only die in your light.</div>
      <div><span class="k">GOAL</span> — reach the <span style="color:#7ee0ff">breaker panel</span> and restore power.</div>
    </div>
  </div>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function size(){ cv.width = innerWidth; cv.height = innerHeight; }
size();
addEventListener('resize', size);
const W = () => cv.width, H = () => cv.height;

const state = {
  playing: false,
  x: 0, y: 0,
  battery: 100, maxBat: 100,
  candles: 0, need: 8,
  enemies: [], particles: [], candles: [],
  breaker: null, spawnT: 0,
};

function reset(){
  state.x = W()*0.5; state.y = H()*0.5;
  state.battery = state.maxBat;
  state.candlesCount = 0;
  state.enemies = []; state.particles = []; state.candles = [];
  state.breaker = { x: W()*0.85, y: H()*0.85, found: false };
  state.spawnT = 0;
  document.getElementById('msg').textContent = '';
}

function rand(a,b){ return a + Math.random()*(b-a); }
function dist(a,b,c,d){ return Math.hypot(a-c,b-d); }

function spawnCandle(){
  let x, y;
  do { x = rand(40,W()-40); y = rand(40,H()-40); }
  while (dist(x,y,state.x,state.y) < 160);
  return { x, y, taken: false };
}
function spawnEnemies(){
  for (let i=0;i<3;i++){
    let x,y;
    do { x = rand(0,W()); y = rand(0,H()); }
    while (dist(x,y,state.x,state.y) < 220);
    state.enemies.push({ x, y, vx: rand(-1.2,1.2), vy: rand(-1.2,1.2), hp: 3 });
  }
}
function makeParticles(x,y,n,color){
  for (let i=0;i<n;i++){
    state.particles.push({ x, y, vx: rand(-1.5,1.5), vy: rand(-2,0), life: rand(30,70), color });
  }
}

const keys = {};
addEventListener('keydown', e=>{ keys[e.code]=true; });
addEventListener('keyup', e=>{ keys[e.code]=false; });

// touch: drag to move
let touchX = 0, touchY = 0, touching = false;
addEventListener('touchstart', e=>{ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; touching=true; });
addEventListener('touchmove', e=>{ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; e.preventDefault(); }, { passive:false });
addEventListener('touchend', ()=>{ touching=false; });

const btn = document.getElementById('startBtn');
btn.addEventListener('click', ()=>{
  document.getElementById('overlay').classList.add('hide');
  reset();
  for (let i=0;i<state.need;i++) state.candles.push(spawnCandle());
  spawnEnemies();
  state.playing = true;
  msg(`Find the ${state.need} candles. Then flip the breaker.`, '#7ee0ff');
});

function msg(t, c){ const el=document.getElementById('msg'); el.textContent=t; el.style.color = c||'#ffd98a'; }

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (state.playing) update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  const spd = 240;
  let dx=0, dy=0;
  if (keys['KeyW']||keys['ArrowUp']) dy-=1;
  if (keys['KeyS']||keys['ArrowDown']) dy+=1;
  if (keys['KeyA']||keys['ArrowLeft']) dx-=1;
  if (keys['KeyD']||keys['ArrowRight']) dx+=1;
  if (touching){ dx = touchX - state.x; dy = touchY - state.y; }
  if (dx||dy){
    const l = Math.hypot(dx,dy);
    const step = Math.min(l, spd*dt*1.2);
    state.x += dx/l*step; state.y += dy/l*step;
    touching = false;
  }
  state.x = Math.max(20, Math.min(W()-20, state.x));
  state.y = Math.max(20, Math.min(H()-20, state.y));

  // battery drain
  state.battery -= dt * 0.9;
  if (state.battery <= 0){ state.battery = 0; gameOver('BATTERY DEAD. THE DARK WINS.'); return; }

  // candles
  for (const c of state.candles){
    if (!c.taken && dist(state.x,state.y,c.x,c.y) < 42){
      c.taken = true; state.candlesCount = (state.candlesCount||0)+1;
      state.battery = Math.min(state.maxBat, state.battery + 35);
      makeParticles(c.x,c.y,14,'#ffd98a');
      if (state.candlesCount >= state.need) msg('ALL CANDLES FOUND. THE BREAKER IS GLOWING.', '#7ee0ff');
    }
  }
  document.getElementById('candleCount').textContent = state.candlesCount||0;

  // breaker
  const b = state.breaker;
  if ((state.candlesCount||0) >= state.need && !b.found){
    b.found = true; makeParticles(b.x,b.y,20,'#7ee0ff');
    msg('FLIP THE BREAKER TO RESTORE POWER!', '#7ee0ff');
  }
  if (b.found && dist(state.x,state.y,b.x,b.y) < 44){ win(); }

  // enemies
  state.spawnT += dt;
  if (state.spawnT > 9){ state.spawnT = 0; spawnEnemies(); }
  for (const e of state.enemies){
    const d = dist(state.x,state.y,e.x,e.y);
    e.x += e.vx*dt; e.y += e.vy*dt;
    if (d < 320){ const a = Math.atan2(state.y-e.y, state.x-e.x); e.x += Math.cos(a)*55*dt; e.y += Math.sin(a)*55*dt; }
    if (d < 150){ e.hp -= dt*4; if (e.hp<=0){ makeParticles(e.x,e.y,12,'#b06cff'); e.dead = true; } }
    e.x = Math.max(0,Math.min(W(),e.x)); e.y = Math.max(0,Math.min(H(),e.y));
  }
  state.enemies = state.enemies.filter(e=>!e.dead);

  for (const e of state.enemies){
    if (dist(state.x,state.y,e.x,e.y) < 24){ gameOver('A SHADOW GOT YOU.'); return; }
  }

  for (const p of state.particles){ p.life--; p.x+=p.vx; p.y+=p.vy; }
  state.particles = state.particles.filter(p=>p.life>0);

  document.getElementById('batBar').style.width = (state.battery/state.maxBat*100)+'%';
  document.getElementById('candleBar').style.width = ((state.candlesCount||0)/state.need*100)+'%';
}

function gameOver(t){
  state.playing = false;
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('overlay').querySelector('.title').textContent = 'DARKNESS';
  document.getElementById('overlay').querySelector('.sub').textContent = t;
  btn.textContent = '↻ RETRY';
}

function win(){
  state.playing = false;
  for (let i=0;i<40;i++) makeParticles(state.breaker.x,state.breaker.y,1,'#7ee0ff');
  document.getElementById('overlay').classList.remove('hide');
  document.getElementById('overlay').querySelector('.title').textContent = 'POWER RESTORED';
  document.getElementById('overlay').querySelector('.sub').textContent = 'LIGHTS ON. YOU BEAT THE DARK.';
  btn.textContent = '↻ PLAY AGAIN';
}

function draw(){
  const Wv = W(), Hv = H();
  ctx.fillStyle = '#02030a';
  ctx.fillRect(0,0,Wv,Hv);

  ctx.strokeStyle = 'rgba(70,80,120,.10)';
  ctx.lineWidth = 1;
  for (let i=0;i<Wv;i+=90){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,Hv); ctx.stroke(); }
  for (let j=0;j<Hv;j+=90){ ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(Wv,j); ctx.stroke(); }

  const lightR = 150 + (state.battery/state.maxBat)*40;
  const grad = ctx.createRadialGradient(state.x,state.y,10, state.x,state.y,lightR);
  grad.addColorStop(0,'rgba(255,235,190,.55)');
  grad.addColorStop(0.5,'rgba(255,200,120,.18)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(state.x,state.y,lightR,0,Math.PI*2); ctx.fill();
  ctx.restore();

  for (const c of state.candles){
    if (c.taken) continue;
    if (dist(c.x,c.y,state.x,state.y) > lightR*1.4 && !state.won) continue;
    const g = ctx.createRadialGradient(c.x,c.y,2,c.x,c.y,26);
    g.addColorStop(0,'rgba(255,217,138,.9)'); g.addColorStop(1,'rgba(255,157,63,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x,c.y,26,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c9cfe0'; ctx.fillRect(c.x-6,c.y+10,12,22);
    ctx.fillStyle = '#ff9d3f';
    ctx.beginPath(); ctx.moveTo(c.x,c.y+4); ctx.lineTo(c.x+3,c.y-4); ctx.lineTo(c.x-3,c.y-4); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(c.x,c.y-6,2.4,0,Math.PI*2); ctx.fill();
  }

  const b = state.breaker;
  const showB = b && (b.found || (state.candlesCount||0) >= state.need);
  if (showB){
    const glow = ctx.createRadialGradient(b.x,b.y,4,b.x,b.y,60);
    glow.addColorStop(0,'rgba(126,224,255,.95)'); glow.addColorStop(1,'rgba(126,224,255,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(b.x,b.y,60,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a6a78'; ctx.fillRect(b.x-22,b.y-30,44,60);
    ctx.fillStyle = '#7ee0ff';
    for (let i=0;i<4;i++) ctx.fillRect(b.x-14, b.y-20+i*14, 28, 8);
    ctx.fillStyle='#fff'; ctx.font='13px monospace'; ctx.textAlign='center';
    ctx.fillText('BREAKER', b.x, b.y+44);
  }

  for (const e of state.enemies){
    const d = dist(state.x,state.y,e.x,e.y);
    if (d > lightR*1.5 && !state.won) continue;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const eg = ctx.createRadialGradient(e.x,e.y,2,e.x,e.y,34);
    eg.addColorStop(0,'rgba(176,108,255,.95)'); eg.addColorStop(1,'rgba(176,108,255,0)');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(e.x,e.y,34,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#2b1038';
    ctx.beginPath(); ctx.arc(e.x,e.y,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#b06cff';
    ctx.fillRect(e.x-6,e.y-2,12,3);
  }

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const pg = ctx.createRadialGradient(state.x,state.y,2,state.x,state.y,30);
  pg.addColorStop(0,'rgba(255,255,220,.9)'); pg.addColorStop(1,'rgba(255,217,138,0)');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(state.x,state.y,30,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#3a4152';
  ctx.beginPath(); ctx.arc(state.x,state.y,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffd98a';
  ctx.beginPath(); ctx.arc(state.x,state.y,5,0,Math.PI*2); ctx.fill();

  for (const p of state.particles){
    ctx.globalAlpha = p.life/70;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x,p.y,3,3);
    ctx.globalAlpha = 1;
  }

  const vg = ctx.createRadialGradient(Wv/2,Hv/2,Math.min(Wv,Hv)*0.3, Wv/2,Hv/2,Math.max(Wv,Hv)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.75)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,Wv,Hv);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
